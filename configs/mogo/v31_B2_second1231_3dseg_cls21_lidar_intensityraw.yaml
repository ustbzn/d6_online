# load_from: /pcpt/pcpt/project/lijun/multimodal_bevfusion/experiments/v31_B2_second1231_3dseg_cls21_lidar_intensityraw/best_bbox_mAP74.41138695220086_epoch_10.pth
# resume_from: /cfs/.tmp/chaoping_detsegflow/multimodal_bevfusion/experiments/v23_cutPasteNoise/latest.pth